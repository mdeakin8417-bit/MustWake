name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node.js required by Cordova
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # JDK 17 is required by the current Android SDK command-line tools
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java 17
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Cordova Android 11 uses JDK 11
      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Verify Java 11
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # IMPORTANT:
      # Cordova Android 11 expects Gradle 7.4.2.
      # Do NOT use the runner's Gradle 9.x.
      - name: Setup Gradle 7.4.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.4.2'

      - name: Verify Gradle
        run: |
          java -version
          gradle --version

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Add Android platform
        run: cordova platform add android@11.0.0

      - name: Verify Cordova environment
        run: |
          cordova --version
          cordova platform ls
          gradle --version
          java -version

      - name: Build APK
        run: cordova build android --release -- --packageType=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MustWake-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
