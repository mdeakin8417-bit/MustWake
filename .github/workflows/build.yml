name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node.js for Cordova CLI
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # JDK 17 is required by current Android SDK command-line tools
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java 17
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Android SDK command-line tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # Cordova Android 11 requires these SDK packages
      - name: Install Android SDK 32
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-32"
          sdkmanager "build-tools;32.0.0"

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/build-tools/32.0.0"

      # Cordova Android 11 uses JDK 11
      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Verify Java 11
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # Cordova Android 11 uses Gradle 7.4.2
      - name: Setup Gradle 7.4.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.4.2'

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Add Android platform
        run: cordova platform add android@11.0.0

      - name: Verify Cordova environment
        run: |
          cordova --version
          cordova platform ls
          java -version
          gradle --version

      - name: Build APK
        run: cordova build android --release -- --packageType=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MustWake-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
