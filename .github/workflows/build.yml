name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android

      - name: Prepare Plugins
        run: cordova prepare android

      - name: Fix Deprecated Gradle Syntax in Plugins
        run: |
          find platforms/android/ -type f \( -name "*.gradle" -o -name "*.xml" \) -exec sed -i 's/compile /implementation /g' {} +
          find platforms/android/ -type f \( -name "*.gradle" -o -name "*.xml" \) -exec sed -i 's/compile(/implementation(/g' {} +

      - name: Install plugins & build APK
        run: cordova build android --release -- --packageType=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MustWake-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
          
