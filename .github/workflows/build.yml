name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'


      # --------------------------------------------------
      # 3. JDK 17
      # Required by current Android SDK command-line tools
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java 17
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"


      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # --------------------------------------------------
      # 5. Install exact Android SDK packages
      # Required by cordova-android 11
      # --------------------------------------------------
      - name: Install Android SDK 32
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-32"
          sdkmanager "build-tools;32.0.0"


      # --------------------------------------------------
      # 6. Verify Android SDK
      # --------------------------------------------------
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-32"
          test -d "$ANDROID_HOME/build-tools/32.0.0"
          echo "Android SDK 32 installed successfully"


      # --------------------------------------------------
      # 7. JDK 11
      # Required by cordova-android 11
      # --------------------------------------------------
      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Verify Java 11
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"


      # --------------------------------------------------
      # 8. Gradle 7.4.2
      # Required by cordova-android 11
      # --------------------------------------------------
      - name: Setup Gradle 7.4.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.4.2'

      - name: Verify Gradle
        run: |
          gradle --version


      # --------------------------------------------------
      # 9. Install Cordova
      # --------------------------------------------------
      - name: Install Cordova
        run: |
          npm install -g cordova@12.0.0
          cordova --version


      # --------------------------------------------------
      # 10. Add Cordova Android 11
      # --------------------------------------------------
      - name: Add Android platform
        run: |
          cordova platform add android@11.0.0
          cordova platform ls


      # --------------------------------------------------
      # 11. Fix old Local Notification Gradle syntax
      # compile -> implementation
      # --------------------------------------------------
      - name: Patch Local Notification plugin
        shell: bash
        run: |
          FILE="platforms/android/cordova-plugin-local-notification/app-localnotification.gradle"

          echo "Checking plugin file..."

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Plugin Gradle file not found:"
            echo "$FILE"
            exit 1
          fi

          echo "Before patch:"
          cat "$FILE"

          sed -i -E \
            "s/^[[:space:]]*compile[[:space:]]+(['\"]me\.leolin:ShortcutBadger:1\.1\.22@aar['\"])/    implementation \1/" \
            "$FILE"

          echo "After patch:"
          cat "$FILE"

          if grep -Eq '^[[:space:]]*compile[[:space:]]+.*ShortcutBadger' "$FILE"; then
            echo "ERROR: Old compile syntax still exists."
            exit 1
          fi

          if ! grep -Eq 'implementation[[:space:]]+.*ShortcutBadger' "$FILE"; then
            echo "ERROR: ShortcutBadger implementation dependency not found."
            exit 1
          fi

          echo "Local Notification Gradle syntax fixed successfully."


      # --------------------------------------------------
      # 12. Verify Cordova environment
      # --------------------------------------------------
      - name: Verify Cordova environment
        run: |
          cordova --version
          cordova platform ls
          java -version
          gradle --version


      # --------------------------------------------------
      # 13. Build APK
      #
      # IMPORTANT:
      # cdvSdkVersion = targetSdkVersion
      # cdvCompileSdkVersion = compileSdkVersion
      #
      # Both are explicitly 32.
      # --------------------------------------------------
      - name: Build APK
        run: |
          cordova build android --release -- \
            --packageType=apk \
            --gradleArg=-PcdvCompileSdkVersion=32 \
            --gradleArg=-PcdvSdkVersion=32 \
            --gradleArg=-PcdvBuildToolsVersion=32.0.0


      # --------------------------------------------------
      # 14. Upload APK
      # --------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MustWake-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
