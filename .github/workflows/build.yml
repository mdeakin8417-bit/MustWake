name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Android SDK setup requires JDK 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java 17
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 32
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-32"
          sdkmanager "build-tools;32.0.0"

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-32"
          test -d "$ANDROID_HOME/build-tools/32.0.0"

      # Cordova Android 11 uses JDK 11
      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle 7.4.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.4.2'

      - name: Verify Build Toolchain
        run: |
          java -version
          gradle --version

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Add Android platform
        run: cordova platform add android@11.0.0

      # Fix old local notification plugin:
      # Gradle 7 removed the old "compile" dependency configuration.
      - name: Patch Local Notification plugin for Gradle 7
        run: |
          FILE="platforms/android/cordova-plugin-local-notification/app-localnotification.gradle"

          if [ -f "$FILE" ]; then
            echo "Patching $FILE..."

            sed -i \
              "s/^[[:space:]]*compile[[:space:]]\\+['\"]me\\.leolin:ShortcutBadger:1\\.1\\.22@aar['\"]/    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'/" \
              "$FILE"

            echo "Patched file:"
            cat "$FILE"
          else
            echo "ERROR: Local notification Gradle file not found."
            exit 1
          fi

      - name: Verify Cordova environment
        run: |
          cordova --version
          cordova platform ls
          java -version
          gradle --version

      # Explicitly use Android SDK 32
      - name: Build APK
        run: |
          cordova build android --release -- \
            --packageType=apk \
            --gradleArg=-PcdvCompileSdkVersion=32 \
            --gradleArg=-PcdvTargetSdkVersion=32 \
            --gradleArg=-PcdvBuildToolsVersion=32.0.0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MustWake-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
